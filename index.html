<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Câu Hỏi 4 Đáp Án</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            gap: 40px;
            max-width: 900px;
            width: 100%;
            align-items: center;
            box-sizing: border-box;
        }

        /* Phần Vòng Quay */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c; /* Mũi tên chỉ xuống */
            z-index: 10;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 6px solid #fff;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
        }

        .spin-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #e17055;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .spin-btn:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        /* Phần Nội Dung Câu Hỏi & Đáp Án */
        .content-box {
            flex-grow: 1;
            background: white;
            color: #2d3436;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-title {
            font-size: 18px;
            font-weight: bold;
            color: #0984e3;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .answer-item {
            background: #dfe6e9;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.2s;
        }

        .answer-item:hover {
            background: #74b9ff;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Vòng quay -->
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="320" height="320"></canvas>
            </div>
            <button class="spin-btn" onclick="spinWheel()">QUAY NGAY</button>
        </div>

        <!-- Khung hiện câu hỏi & 4 đáp án -->
        <div class="content-box">
            <div class="question-title" id="q-title">Hãy bấm nút "QUAY NGAY" để chọn câu hỏi!</div>
            <div class="question-text" id="q-text">Nội dung câu hỏi sẽ hiển thị ở đây sau khi vòng quay dừng lại.</div>
            <div class="answers-grid" id="answers-container">
                <div class="answer-item">A. Đang cập nhật...</div>
                <div class="answer-item">B. Đang cập nhật...</div>
                <div class="answer-item">C. Đang cập nhật...</div>
                <div class="answer-item">D. Đang cập nhật...</div>
            </div>
        </div>
    </div>

    <script>
        const sectors = [
            { color: "#ff7675", text: "Ô Số 1" },
            { color: "#55efc4", text: "Ô Số 2" },
            { color: "#ffeaa7", text: "Ô Số 3" },
            { color: "#74b9ff", text: "Ô Số 4" }
        ];

        const dataQuestions = [
            {
                title: "Câu hỏi cho Ô Số 1:",
                question: "Thủ đô của Việt Nam là gì?",
                answers: ["A. Thành phố Hồ Chí Minh", "B. Hà Nội", "C. Đà Nẵng", "D. Hải Phòng"]
            },
            {
                title: "Câu hỏi cho Ô Số 2:",
                question: "Đâu là ngôn ngữ lập trình chạy trên trình duyệt web?",
                answers: ["A. Python", "B. C++", "C. JavaScript", "D. Java"]
            },
            {
                title: "Câu hỏi cho Ô Số 3:",
                question: "1 + 1 bằng mấy?",
                answers: ["A. 1", "B. 3", "C. 4", "D. 2"]
            },
            {
                title: "Câu hỏi cho Ô Số 4:",
                question: "Hành tinh nào gần Mặt Trời nhất trong Hệ Mặt Trời?",
                answers: ["A. Sao Kim", "B. Sao Thủy", "C. Trái Đất", "D. Sao Hỏa"]
            }
        ];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const totalSectors = sectors.length;
        const arc = (2 * Math.PI) / totalSectors;
        
        let currentRotation = 0; // Tính theo độ
        let isSpinning = false;

        // Vẽ vòng quay lên canvas
        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, i) => {
                const angle = i * arc;
                
                // Vẽ miếng bánh xe
                ctx.beginPath();
                ctx.fillStyle = sector.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.save();

                // Vẽ chữ
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = (sector.text === "Ô Số 3") ? "#2d3436" : "#ffffff";
                ctx.font = "bold 16px 'Segoe UI', sans-serif";
                ctx.fillText(sector.text, radius - 20, 6);
                ctx.restore();
            });
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const randomExtra = Math.floor(Math.random() * 360);
            const totalDegrees = currentRotation + 1800 + randomExtra; 
            
            currentRotation = totalDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                
                // Tính toán chính xác ô trúng dựa trên vị trí mũi tên ở góc 12 giờ (hướng lên trên)
                const normalizedDegree = (360 - (currentRotation % 360) + 270) % 360;
                const index = Math.floor(normalizedDegree / (360 / totalSectors));
                
                showQuestion(index);
            }, 4000);
        }

        function showQuestion(index) {
            const qData = dataQuestions[index];
            document.getElementById("q-title").innerText = qData.title;
            document.getElementById("q-text").innerText = qData.question;

            const ansContainer = document.getElementById("answers-container");
            ansContainer.innerHTML = ""; 

            qData.answers.forEach(ans => {
                const div = document.createElement("div");
                div.className = "answer-item";
                div.innerText = ans;
                ansContainer.appendChild(div);
            });
        }
    </script>
</body>
</html>
